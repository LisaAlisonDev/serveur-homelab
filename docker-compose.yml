services:
  app:
    container_name: homelab-app
    build:
      context: ./app
      dockerfile: Dockerfile
    expose:
      - "${APP_PORT}"
    environment:
      NODE_ENV: production
      PORT: ${APP_PORT}
    networks:
      homelab-network:
        ipv4_address: 172.26.0.2
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:${APP_PORT}').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    container_name: homelab-nginx
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "${NGINX_PORT}:80"
      - "443:443"
    environment:
      APP_PORT: ${APP_PORT}
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      homelab-network:
        ipv4_address: 172.26.0.3
    restart: unless-stopped

  postgres:
    image: postgres:16.11-alpine3.22
    container_name: homelab-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env
      # - ../../.env.development.local
    volumes:
      - pg_volume:/var/lib/postgresql/data:rw
      - ./postgres/postgres.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d:ro
    command: [ "postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_statement=none", "-c", "log_min_duration_statement=1000", "-c", "log_connections=on", "-c", "log_disconnections=on" ]
    user: "70:70" # Postgres user
    healthcheck:
      test: [ "CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-postgres}" -h localhost || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    stop_grace_period: 120s
    networks:
      homelab-network:
        ipv4_address: 172.26.0.4

  pgadmin:
    image: elestio/pgadmin:latest
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    env_file:
      - .env
      # - ../../.env.development.local
    volumes:
      - pgadmin_volume:/var/lib/pgadmin:rw
    depends_on:
      - postgres
    networks:
      homelab-network:
          ipv4_address: 172.26.0.5

volumes:
  homelab-data:
  pg_volume:
    driver: local
  pgadmin_volume:
    driver: local

networks:
  homelab-network:
    name: homelab-network
    driver: bridge
    ipam:
      config:
         - subnet: 172.26.0.0/16
           gateway: 172.26.0.1
services:
  app:
    container_name: homelab-app
    build:
      context: ./app
      dockerfile: Dockerfile
    expose:
      - "${APP_PORT}"
    environment:
      NODE_ENV: production
      PORT: ${APP_PORT}
    networks:
      homelab-network:
        ipv4_address: 172.26.0.2
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:${APP_PORT}').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s


  nginx:
    container_name: homelab-nginx
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "${NGINX_PORT}:80"
      - "443:443"
    environment:
      APP_PORT: ${APP_PORT}
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      homelab-network:
        ipv4_address: 172.26.0.3
    restart: unless-stopped

volumes:
  homelab-data:

networks:
  homelab-network:
    name: homelab-network
    driver: bridge
    ipam:
      config:
         - subnet: 172.26.0.0/16
           gateway: 172.26.0.1